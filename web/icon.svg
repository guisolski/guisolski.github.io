    <linearGradient id="dawn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4b3ce0"/>
      <stop offset="0.55" stop-color="#e04ba6"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#dawn)"/>
  <path fill="#ffffff" d="M32 9 36.6 27.4 55 32 36.6 36.6 32 55 27.4 36.6 9 32 27.4 27.4Z"/>
</svg>
